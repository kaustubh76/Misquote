[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned below 0.8 on purpose. v3-core's TickMath and FullMath declare
# `pragma solidity <0.8.0` because their correctness depends on arithmetic
# wrapping silently; under 0.8's checked arithmetic they would revert instead of
# producing the value the deployed pools actually produce. Compiling the
# reference implementation at the version it was written for is the entire point
# of differential-testing against it.
solc = "0.7.6"
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"

remappings = [
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/",
]
