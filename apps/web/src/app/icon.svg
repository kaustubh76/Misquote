<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Misquote">
  <!--
    A P25-P75 band: the one mark this product is about. A range with a median
    tick, rather than the point estimate it argues against.

    Colours follow the browser's chrome theme, because a favicon sits on the
    tab strip rather than on the page and cannot inherit the page tokens.
  -->
  <style>
    .bg { fill: #0b0d10; }
    .band { fill: #5fb87a; opacity: 0.35; }
    .edge { fill: #5fb87a; }
    .axis { fill: #6b7480; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fbfbfa; }
      .band { fill: #157347; opacity: 0.3; }
      .edge { fill: #157347; }
      .axis { fill: #8a929c; }
    }
  </style>

  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="axis" x="4" y="23" width="24" height="1" />
  <rect class="band" x="7" y="9" width="18" height="10" rx="1.5" />
  <rect class="edge" x="7" y="9" width="1.6" height="10" />
  <rect class="edge" x="23.4" y="9" width="1.6" height="10" />
  <rect class="edge" x="15.2" y="6" width="1.6" height="16" />
</svg>
