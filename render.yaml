# Render blueprint for the Misquote API.
#
#   https://render.com/docs/blueprint-spec
#
# This file used to say the service "computes nothing, so it needs no database,
# no persistent disk, no RPC and no secrets". Every clause of that is now false,
# and a deployment manifest is exactly where a service quietly acquires
# capabilities nobody asked it to have — so what it needs is stated here rather
# than discovered.
#
# **It reaches a chain.** `/wallet/{address}/positions` and an unsampled
# `/registry/agents/{id}` read BSC. Without `BSC_RPC_URL` they fall back to the
# public endpoints, and when none answers they refuse at 503 saying so — the
# service comes up either way, and says which it is.
#
# **It reads the tape.** `/tape`, `/quote/preflight`, `/quote/eligibility` and
# every replay open a database. The indexed one, `data/misquote.db`, is 245MB
# and gitignored, so for the life of this blueprint those routes came up 503 on
# every host that was not the author's laptop — a third of the service
# permanently refusing, in a deployment nobody had run.
#
# `DB_PATH` below points instead at `data/deploy/tape.db`, which **is** in this
# repository: 31MB holding the last ten days of all three verified pools, cut by
# `make tape-slice`. It is a subset, and it is a subset that says so — the
# `covered` rows are intersected with the window, so the coverage this deploy
# reports is coverage it actually holds. `tests/api/test_tape_slice.py` asserts
# both directions of that.
#
# Ten days rather than the full thirty because of `MIN_HOURS_TO_ANNUALISE`,
# which is seven: below it a quote states the period it covers instead of an
# annual rate. Ten clears it with margin and fits in a checkout; thirty is
# 105MB and does not.
#
# **It writes.** `POST /quote` creates a job in `data/jobs.db`. On an instance
# with no disk that database lives on ephemeral storage and is lost on restart,
# which for queued work means the queue is lost with it.
#
# ## The worker, and what happens without one
#
# A quote is run by `python -m misquote.ops.worker`, not by the web process —
# `ranges.quote()` raises if entered twice in one process, and `fork_map` must
# fork from a single-threaded parent, which an ASGI server is not. The worker is
# declared below and is **commented out**, because Render background workers
# need a paid plan and this blueprint is a free-tier demo.
#
# That absence is not silent. `jobs.worker_last_seen` reports whether anything
# has ever claimed a job, `POST /quote` returns it, and the response says
# plainly that a job may sit queued when nothing is draining. Without it the
# page would show "queued" forever and look exactly like a slow replay.
#
# A free instance also spins down when idle, so even with a worker a 4.6-hour
# replay would not survive to finish. The pre-flight, the refusals and every
# read route are what this deployment can honestly serve.
#
# ## Why the install is editable
#
# `pyproject.toml` packages `packages/misquote` into the wheel and **not** the
# artifacts, which live under `apps/web/`. A normal install puts the code in
# site-packages, and `REPO = Path(__file__).resolve().parents[3]` then points at
# site-packages rather than at the checkout — so the service would come up
# healthy, serving zero artifacts, and `/health` would say `ok: true` because
# that field is deliberately about the process rather than the data.
#
# `-e` keeps `__file__` inside the repository, so the path resolves. The
# alternative is `MISQUOTE_ARTIFACTS`, which `service.py` honours; it is left
# unset here because a hardcoded absolute host path is the more brittle of the
# two and this one is checkable locally.
#
# ## The free plan sleeps
#
# A free web service is spun down after inactivity and the next request pays a
# cold start. For a demo API over static files that is the right trade, and it
# is recorded rather than discovered: a judge clicking a link after an idle hour
# waits for a boot, and that is not the service being broken.
services:
  - type: web
    name: misquote-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn misquote.api.service:app --host 0.0.0.0 --port $PORT
    # `/health` answers from the process without touching an artifact, which is
    # what makes it usable as a health check: a probe that went red when a file
    # was missing would restart the container in a loop over exactly the
    # condition `/artifacts` exists to explain.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      # Unset here on purpose. The chain routes prefer this and fall back to the
      # public endpoints the indexer already uses; setting a keyed URL in a
      # committed blueprint would put a credential in git.
      - key: BSC_RPC_URL
        sync: false
      # The committed slice, not the 245MB tape — see above. Relative to the
      # repo root, which is the working directory the start command runs from.
      - key: DB_PATH
        value: data/deploy/tape.db

# The worker that actually runs a replay. Commented out rather than deleted:
# Render background workers require a paid plan, and a blueprint that declared
# one would fail to apply on the free tier this file targets. Uncomment it — and
# attach a disk for `data/jobs.db` — to make `POST /quote` produce a quote
# rather than a queued job.
