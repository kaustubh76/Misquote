[project]
name = "misquote"
version = "0.1.0"
description = "Agent marketplace for BNB Chain: quant agents, a no-look-ahead quote engine, and a tearsheet generated from chain state"
readme = "Readme.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "web3>=7.0,<8",
    "eth-account>=0.13",
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ops = [
    "prometheus-client>=0.20",
    "python-telegram-bot>=21",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/misquote"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# chainfork tests need a live anvil BSC fork; excluded from the default run so
# `make test` stays offline and fast. `make fork-diff` opts them back in.
addopts = "-ra -m 'not chainfork'"
asyncio_mode = "auto"
markers = [
    "chainfork: requires a pinned anvil BSC mainnet fork (make fork-diff)",
    "live_signing: opts out of the _no_real_signing safety fixture",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["misquote"]
